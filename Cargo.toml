[package]
name = "cosmetics"
version = "0.1.9"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "Independent Minecraft Bedrock native cosmetics HTTP overlay"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
brotli = "8"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
minhook-sys = "0.1.1"
